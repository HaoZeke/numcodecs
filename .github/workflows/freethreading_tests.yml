name: Free Threading Tests
on: [push, pull_request]
env:
  UV_SYSTEM_PYTHON: 1
jobs:
  freethreading_tests:
    name: Free Threaded Build ${{ matrix.os.emoji }} ${{ matrix.os.name }} ${{ matrix.python }}
    runs-on: ${{ matrix.os.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Linux
            matrix: linux
            emoji: 🐧
            runs-on: [ubuntu-latest]
          - name: macOS intel
            matrix: macos
            emoji: 🍎
            runs-on: [macos-13]
          - name: macOS silicon
            matrix: macos
            emoji: 🍎
            runs-on: [macos-14]
          - name: Windows
            matrix: windows
            emoji: 🪟
            runs-on: [windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3.1.1
        with:
          channels: conda-forge
          miniforge-version: latest
          python-version: '3.13'
      - name: Disable Coverage
        run: |
          perl -i -ne 'print unless /--cov/' pyproject.toml
      - name: Install compilers
        run: conda install -y c-compiler cxx-compiler
      - name: Install clang
        if: ${{ matrix.os.runs-on[0] }} == 'macos-13'
        run: conda install -y 'clang>=12.0.1,<17'
      - name: Show conda environment info
        run: |
          conda info
          conda config --show-sources
          conda list --show-channel-urls
      - name: Build
        run: |
          python -mpip install -v "setuptools>=77" "setuptools-scm[toml]>=6.2" Cython "py-cpuinfo" "numpy>2" packaging
          export DISABLE_NUMCODECS_AVX2=""
          export CFLAGS="-std=c17 -D_POSIX_C_SOURCE=200809L"
          python -mpip install --verbose -e .[test,test_extras,crc32c]
      - name: Run Tests
        run: |
          python -mpip install pytest-timeout pytest-durations pytest-run-parallel
          python -m pytest --parallel-threads=2 --iterations=2 -v -s --timeout=600 --durations=10 -m "not thread_unsafe"
