name: Free Threading Tests
on: [push, pull_request]
jobs:
  freethreading_tests:
    name: Free Threaded Build ${{ matrix.os.emoji }} ${{ matrix.os.name }} ${{ matrix.python }}
    runs-on: ${{ matrix.os.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Linux
            matrix: linux
            emoji: 🐧
            runs-on: [ubuntu-latest]
          - name: macOS intel
            matrix: macos
            emoji: 🍎
            runs-on: [macos-13]
          - name: macOS silicon
            matrix: macos
            emoji: 🍎
            runs-on: [macos-14]
          - name: Windows
            matrix: windows
            emoji: 🪟
            runs-on: [windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.2"
          python-version: 3.13t
          enable-cache: false
      - name: Disable Coverage
        run: |
          perl -i -ne 'print unless /--cov/' pyproject.toml
      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3.1.1
        with:
          channels: conda-forge
          miniforge-version: latest
      - name: Install compilers
        run: conda install -y c-compiler cxx-compiler
      - name: Install clang
        if: ${{ matrix.os.runs-on[0] }} == 'macos-13'
        run: conda install -y 'clang>=12.0.1,<17'
      - name: Show conda environment info
        run: |
          conda info
          conda config --show-sources
          conda list --show-channel-urls
      - name: Set up Python
        run: uv python install
      - name: Install Dependencies
        run: |
          uv pip install pytest-timeout pytest-run-parallel "zarr>=3"
      - name: Editable build
        run: |
          uv pip install -v -e .[test,test_extras,crc32c]
      - name: Run Tests
        run: |
          uv run --no-project python -m pytest --parallel-threads=2 --iterations=2 -v -s --timeout=600 --durations=10 -m "not thread_unsafe"
